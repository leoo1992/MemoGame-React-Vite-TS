name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: node --test tests/quality.test.mjs
      - run: npm run lint
      - run: npm run build
